<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Logs — RO PH Community Hub</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/darkmode.js"></script>
    <style>
        .logs-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .logs-header {
            background: linear-gradient(135deg, var(--ro-brown-dark) 0%, var(--ro-brown-medium) 100%);
            color: #fff;
            padding: 1.2rem 1.5rem;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            border-bottom: 2px solid var(--ro-gold);
        }

        .logs-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--ro-gold-bright);
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-toggle {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        .btn-toggle:hover { background: rgba(255,255,255,0.25); }

        .btn-toggle.active {
            background: var(--ro-gold);
            color: #fff;
        }

        .btn-refresh {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        .btn-refresh:hover { background: rgba(255,255,255,0.25); }

        .stats {
            background: var(--ro-parchment-light);
            padding: 0.75rem 1.5rem;
            font-size: 0.85rem;
            color: var(--ro-text-light);
            border-bottom: 1px solid rgba(139, 105, 20, 0.15);
        }

        .stats span { font-weight: 600; color: var(--ro-brown); }

        .table-wrapper {
            background: #fff;
            border-radius: 0 0 12px 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(58, 31, 4, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--ro-parchment);
            text-align: left;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--ro-text-light);
            border-bottom: 1px solid rgba(139, 105, 20, 0.2);
        }

        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #f0ebe0;
            font-size: 0.88rem;
            vertical-align: top;
        }

        tr:hover td { background: var(--ro-parchment-light); }

        .col-time { width: 140px; color: var(--ro-text-light); font-size: 0.8rem; }
        .col-intent { width: 120px; }
        .col-question { width: 35%; }
        .col-answer { width: auto; }

        .intent-badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(139, 105, 20, 0.1);
            color: var(--ro-gold);
        }

        .intent-badge.general {
            background: #fce8e6;
            color: #d93025;
        }

        .answer-text {
            white-space: pre-wrap;
            max-height: 80px;
            overflow: hidden;
            color: #c62828;
            font-size: 0.83rem;
        }

        .answer-text.answered { color: var(--ro-text); }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--ro-text-light);
        }

        @media (max-width: 700px) {
            .logs-container { padding: 0.5rem; }
            .col-time { display: none; }
            .col-intent { width: 80px; }
            td, th { padding: 0.5rem; font-size: 0.82rem; }
        }
    </style>
</head>
<body>

    <!-- Nav -->
    <nav class="site-nav">
        <a href="/" class="nav-logo">RO PH Hub</a>
        <button class="nav-hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')">&#9776;</button>
        <ul class="nav-links">
            <li><a href="/chat">Chat</a></li>
            <li><a href="/streamers">Streamers</a></li>
            <li><a href="/servers">Servers</a></li>
            <li><a href="/forum">Forum</a></li>
        </ul>
    </nav>

    <div class="logs-container">
        <div class="logs-header">
            <h1>Query Logs</h1>
            <div class="controls">
                <button class="btn-toggle active" id="btnUnanswered" onclick="toggleFilter(true)">Unanswered</button>
                <button class="btn-toggle" id="btnAll" onclick="toggleFilter(false)">All Queries</button>
                <button class="btn-refresh" onclick="loadLogs()">Refresh</button>
            </div>
        </div>
        <div class="stats" id="stats">Loading...</div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-time">Time</th>
                        <th class="col-intent">Intent</th>
                        <th class="col-question">Question</th>
                        <th class="col-answer">Answer</th>
                    </tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display:none;">No logs found.</div>
        </div>
    </div>

    <script>
        let unansweredOnly = true;

        function toggleFilter(val) {
            unansweredOnly = val;
            document.getElementById('btnUnanswered').className = 'btn-toggle' + (val ? ' active' : '');
            document.getElementById('btnAll').className = 'btn-toggle' + (!val ? ' active' : '');
            loadLogs();
        }

        function formatTime(iso) {
            const d = new Date(iso);
            return d.toLocaleString(undefined, {
                month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function truncate(text, len) {
            if (text.length <= len) return text;
            return text.substring(0, len) + '...';
        }

        async function loadLogs() {
            const body = document.getElementById('logBody');
            const empty = document.getElementById('emptyState');
            const stats = document.getElementById('stats');

            try {
                const res = await fetch(`/api/logs?unanswered_only=${unansweredOnly}&limit=200`);
                const logs = await res.json();

                stats.innerHTML = `Showing <span>${logs.length}</span> ${unansweredOnly ? 'unanswered' : 'total'} queries`;

                if (logs.length === 0) {
                    body.innerHTML = '';
                    empty.style.display = 'block';
                    return;
                }

                empty.style.display = 'none';
                body.innerHTML = logs.map(log => {
                    const intent = escapeHtml(log.intent || 'unknown');
                    const intentClass = log.intent === 'general' ? ' general' : '';
                    const answerClass = log.is_unanswered ? '' : ' answered';
                    return `<tr>
                        <td class="col-time">${escapeHtml(formatTime(log.timestamp))}</td>
                        <td class="col-intent"><span class="intent-badge${intentClass}">${intent}</span></td>
                        <td class="col-question">${escapeHtml(log.question)}</td>
                        <td class="col-answer"><div class="answer-text${answerClass}">${escapeHtml(truncate(log.answer, 200))}</div></td>
                    </tr>`;
                }).join('');
            } catch (err) {
                stats.textContent = 'Error loading logs.';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadLogs();
    </script>
</body>
</html>
