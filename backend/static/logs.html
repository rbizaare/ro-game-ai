<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Logs - RO Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #333;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            color: #fff;
            padding: 1.2rem 1.5rem;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        header h1 { font-size: 1.2rem; font-weight: 600; }

        .controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-toggle {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        .btn-toggle:hover { background: rgba(255,255,255,0.25); }

        .btn-toggle.active {
            background: #4a90d9;
            color: #fff;
        }

        .btn-refresh {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        .btn-refresh:hover { background: rgba(255,255,255,0.25); }

        .stats {
            background: #fff;
            padding: 0.75rem 1.5rem;
            font-size: 0.85rem;
            color: #666;
            border-bottom: 1px solid #e0e0e0;
        }

        .stats span { font-weight: 600; color: #333; }

        .table-wrapper {
            background: #fff;
            border-radius: 0 0 12px 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f5f5f5;
            text-align: left;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #888;
            border-bottom: 1px solid #e0e0e0;
        }

        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.88rem;
            vertical-align: top;
        }

        tr:hover td { background: #f9f9f9; }

        .col-time { width: 140px; color: #888; font-size: 0.8rem; }
        .col-intent { width: 120px; }
        .col-question { width: 35%; }
        .col-answer { width: auto; }

        .intent-badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            background: #e8f0fe;
            color: #1a73e8;
        }

        .intent-badge.general {
            background: #fce8e6;
            color: #d93025;
        }

        .answer-text {
            white-space: pre-wrap;
            max-height: 80px;
            overflow: hidden;
            color: #c62828;
            font-size: 0.83rem;
        }

        .answer-text.answered { color: #333; }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover { color: #fff; }

        @media (max-width: 700px) {
            body { padding: 0.5rem; }
            .col-time { display: none; }
            .col-intent { width: 80px; }
            td, th { padding: 0.5rem; font-size: 0.82rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Query Logs</h1>
            <div class="controls">
                <button class="btn-toggle active" id="btnUnanswered" onclick="toggleFilter(true)">Unanswered</button>
                <button class="btn-toggle" id="btnAll" onclick="toggleFilter(false)">All Queries</button>
                <button class="btn-refresh" onclick="loadLogs()">Refresh</button>
            </div>
        </header>
        <div class="stats" id="stats">Loading...</div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-time">Time</th>
                        <th class="col-intent">Intent</th>
                        <th class="col-question">Question</th>
                        <th class="col-answer">Answer</th>
                    </tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display:none;">No logs found.</div>
        </div>
        <a href="/" class="back-link">&larr; Back to Chat</a>
    </div>

    <script>
        let unansweredOnly = true;

        function toggleFilter(val) {
            unansweredOnly = val;
            document.getElementById('btnUnanswered').className = 'btn-toggle' + (val ? ' active' : '');
            document.getElementById('btnAll').className = 'btn-toggle' + (!val ? ' active' : '');
            loadLogs();
        }

        function formatTime(iso) {
            const d = new Date(iso);
            return d.toLocaleString(undefined, {
                month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function truncate(text, len) {
            if (text.length <= len) return text;
            return text.substring(0, len) + '...';
        }

        async function loadLogs() {
            const body = document.getElementById('logBody');
            const empty = document.getElementById('emptyState');
            const stats = document.getElementById('stats');

            try {
                const res = await fetch(`/api/logs?unanswered_only=${unansweredOnly}&limit=200`);
                const logs = await res.json();

                stats.innerHTML = `Showing <span>${logs.length}</span> ${unansweredOnly ? 'unanswered' : 'total'} queries`;

                if (logs.length === 0) {
                    body.innerHTML = '';
                    empty.style.display = 'block';
                    return;
                }

                empty.style.display = 'none';
                body.innerHTML = logs.map(log => {
                    const intentClass = log.intent === 'general' ? ' general' : '';
                    const answerClass = log.is_unanswered ? '' : ' answered';
                    return `<tr>
                        <td class="col-time">${formatTime(log.timestamp)}</td>
                        <td class="col-intent"><span class="intent-badge${intentClass}">${log.intent || 'unknown'}</span></td>
                        <td class="col-question">${escapeHtml(log.question)}</td>
                        <td class="col-answer"><div class="answer-text${answerClass}">${escapeHtml(truncate(log.answer, 200))}</div></td>
                    </tr>`;
                }).join('');
            } catch (err) {
                stats.textContent = 'Error loading logs.';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadLogs();
    </script>
</body>
</html>
